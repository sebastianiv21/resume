name: Cleanup CV preview
on: delete

permissions:
  contents: read

jobs:
  cleanup:
    # Only for branch deletions; never touch production (main).
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete this branch's preview deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.ref }}
          PROJECT: rendercv
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          auth="Authorization: Bearer $CF_API_TOKEN"
          page=1
          deleted=0
          while :; do
            resp=$(curl -fsS -H "$auth" "$base?page=$page&per_page=25")
            count=$(echo "$resp" | jq '.result | length')
            [ "$count" -eq 0 ] && break
            for id in $(echo "$resp" | jq -r --arg b "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id'); do
              echo "Deleting deployment $id"
              curl -fsS -X DELETE -H "$auth" "$base/$id?force=true" >/dev/null
              deleted=$((deleted + 1))
            done
            page=$((page + 1))
          done
          echo "Removed $deleted preview deployment(s) for branch '$BRANCH'." >> "$GITHUB_STEP_SUMMARY"
